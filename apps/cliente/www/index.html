<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101b2d">
<title>É-Já</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<header>
  <div class="brand">É-<span>JÁ</span></div>
  <button id="sair" class="hidden">Sair</button>
</header>
<main>
  <section id="telaAuth" class="hidden">
    <div class="card">
      <h2 id="authTitulo">Entrar</h2>
      <form id="authForm">
        <div id="campoNome" class="hidden">
          <label for="authNome">Seu nome</label>
          <input id="authNome" maxlength="80" placeholder="Nome e sobrenome">
        </div>
        <label for="authEmail">E-mail</label>
        <input id="authEmail" type="email" required autocomplete="email">
        <label for="authSenha">Senha</label>
        <input id="authSenha" type="password" required minlength="6" autocomplete="current-password">
        <button id="authBtn" class="primary" type="submit">Entrar</button>
      </form>
      <button id="authLink" class="link" type="button">Receber link de acesso por e-mail</button>
      <button id="authTroca" class="link" type="button"></button>
      <div id="authMsg" class="erro"></div>
    </div>
  </section>
  <section id="telaApp" class="hidden">
    <div id="formCard">
      <h1>O que vamos entregar?</h1>
      <p class="intro">Toque no mapa para marcar a <b>retirada</b> e depois a <b>entrega</b>.</p>
      <div id="mapa"></div>
      <div class="card">
        <form id="deliveryForm">
          <label for="origem">Endereço de retirada</label>
          <input id="origem" placeholder="Rua, número e bairro" required minlength="3" maxlength="200">
          <label for="destino">Endereço de entrega</label>
          <input id="destino" placeholder="Rua, número e bairro" required minlength="3" maxlength="200">
          <label for="tipo">O que será transportado?</label>
          <select id="tipo">
            <option>Documento ou envelope</option>
            <option>Pequena encomenda</option>
            <option>Compra de loja</option>
            <option>Outro item permitido</option>
          </select>
          <div class="price">
            <div><div class="small">Valor da corrida</div><div id="km" class="small">Marque os dois pontos no mapa</div></div>
            <strong id="valor">—</strong>
          </div>
          <button class="secondary" type="button" onclick="limparPontos()">Remarcar pontos</button>
          <button class="primary" type="submit">Pedir motoboy É-Já</button>
        </form>
      </div>
    </div>
    <div id="pedido" class="card hidden" aria-live="polite">
      <span class="pill">Seu pedido</span>
      <h2 style="margin-top:14px">Sua entrega</h2>
      <div id="resumo" class="small"></div>
      <div id="estado" class="status">Procurando um motoboy disponível…</div>
      <button id="btnCancelar" class="secondary" onclick="cancelarPedido()">Cancelar pedido</button>
      <button id="btnNovo" class="primary hidden" onclick="novoPedido()">Fazer outro pedido</button>
    </div>
  </section>
</main>
<footer>É-Já · Pelotas-RS · Versão de testes</footer>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/config.js"></script>
<script src="shared/auth.js"></script>
<script src="app.js"></script>
</body>
</html>
