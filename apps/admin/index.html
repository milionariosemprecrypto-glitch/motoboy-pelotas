<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>É-Já Admin</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
main { max-width:1100px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { text-align:left; padding:8px 6px; border-top:1px solid var(--border); vertical-align:top; }
td button { padding:6px 10px; border-radius:8px; border:1px solid var(--primary); background:white; color:var(--primary); font-weight:700; cursor:pointer; margin:2px; }
td button.bloq { border-color:#b8372a; color:#b8372a; }
.st-pendente { color:#9a6b00; font-weight:700; } .st-aprovado { color:#087e67; font-weight:700; } .st-bloqueado { color:#b8372a; font-weight:700; }
.wrap { overflow-x:auto; }
</style>
</head>
<body>
<header><div class="brand">É-<span>JÁ</span> <span style="color:#c0cada;font-weight:400">ADMIN</span></div><button id="sair" class="hidden">Sair</button></header>
<main>
  <section id="telaAuth" class="hidden">
    <div class="card" style="max-width:420px;margin:auto">
      <h2 id="authTitulo">Entrar</h2>
      <form id="authForm">
        <div id="campoNome" class="hidden"><input id="authNome"></div>
        <label for="authEmail">E-mail</label><input id="authEmail" type="email" required>
        <label for="authSenha">Senha</label><input id="authSenha" type="password" required>
        <button id="authBtn" class="primary" type="submit">Entrar</button>
      </form>
      <button id="authLink" class="link hidden" type="button"></button>
      <button id="authTroca" class="link hidden" type="button"></button>
      <div id="authMsg" class="erro"></div>
    </div>
  </section>
  <section id="telaApp" class="hidden">
    <div id="semAcesso" class="card hidden"><h2>Sem acesso</h2><p class="small">Esta conta não é administradora.</p></div>
    <div id="painel" class="hidden">
      <div class="seg">
        <button id="abaM" class="active" onclick="aba('m')">Motoboys</button>
        <button id="abaP" onclick="aba('p')">Pedidos</button>
      </div>
      <div id="secM" class="card wrap">
        <h2>Motoboys <button class="link" style="display:inline" onclick="carregarMotoboys()">↻ atualizar</button></h2>
        <table><thead><tr><th>Nome / contato</th><th>CPF · CNH</th><th>Moto</th><th>Documentos</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tbM"></tbody></table>
      </div>
      <div id="secP" class="card wrap hidden">
        <h2>Pedidos (últimos 200) <button class="link" style="display:inline" onclick="carregarPedidos()">↻ atualizar</button></h2>
        <table><thead><tr><th>Data</th><th>Cliente</th><th>Motoboy</th><th>Retirada → Entrega</th><th>km</th><th>Valor</th><th>Status</th></tr></thead><tbody id="tbP"></tbody></table>
      </div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/config.js"></script>
<script src="../shared/auth.js"></script>
<script>
// Painel admin: o banco só responde se profiles.role = 'admin' (verificado nas RPCs e no RLS).
iniciarAuth({ role: "cliente", aoEntrar: async (u) => {
  const { data } = await db.from("profiles").select("role").eq("id", u.id).maybeSingle();
  const admin = data && data.role === "admin";
  show("painel", admin); show("semAcesso", !admin);
  if (admin) { carregarMotoboys(); carregarPedidos(); }
}});

function aba(a) {
  show("secM", a === "m"); show("secP", a === "p");
  $("abaM").classList.toggle("active", a === "m"); $("abaP").classList.toggle("active", a === "p");
}
const td = (txt, cls) => { const c = document.createElement("td"); c.textContent = txt ?? ""; if (cls) c.className = cls; return c; };
const dt = d => d ? new Date(d).toLocaleString("pt-BR") : "—";

async function abrirDoc(caminho) {
  const { data, error } = await db.storage.from("motoboy-docs").createSignedUrl(caminho, 120);
  if (error) return alert(erroMsg(error));
  window.open(data.signedUrl, "_blank");
}

async function carregarMotoboys() {
  const { data, error } = await db.rpc("admin_motoboys");
  const tb = $("tbM"); tb.textContent = "";
  if (error) return alert(erroMsg(error));
  data.forEach(m => {
    const tr = document.createElement("tr");
    tr.append(td((m.nome || "(sem nome)") + "\n" + (m.email || "") + "\n" + (m.telefone || "")),
      td((m.cpf || "—") + " · " + (m.cnh || "—")), td((m.modelo || "—") + " · " + (m.placa || "—")));
    const docs = document.createElement("td");
    [["Foto", m.foto_path], ["CNH", m.doc_path]].forEach(([n, p]) => {
      if (!p) return; const b = document.createElement("button"); b.textContent = n; b.onclick = () => abrirDoc(p); docs.append(b);
    });
    if (!m.enviado_em) docs.textContent = "não enviou";
    tr.append(docs, td(m.status + (m.online ? " · online" : ""), "st-" + m.status));
    const acoes = document.createElement("td");
    [["aprovado", "Aprovar", ""], ["bloqueado", "Bloquear", "bloq"], ["pendente", "Voltar p/ pendente", ""]].forEach(([s, n, c]) => {
      if (m.status === s) return;
      const b = document.createElement("button"); b.textContent = n; b.className = c;
      b.onclick = async () => {
        if (!confirm(n + " " + (m.nome || m.email) + "?")) return;
        const { error } = await db.rpc("definir_status_motoboy", { p_motoboy: m.id, p_status: s });
        if (error) alert(erroMsg(error)); carregarMotoboys();
      };
      acoes.append(b);
    });
    tr.append(acoes);
    tr.style.whiteSpace = "pre-line";
    tb.append(tr);
  });
  if (!data.length) tb.innerHTML = '<tr><td colspan="6" class="small">Nenhum motoboy cadastrado.</td></tr>';
}

async function carregarPedidos() {
  const { data, error } = await db.rpc("admin_pedidos");
  const tb = $("tbP"); tb.textContent = "";
  if (error) return alert(erroMsg(error));
  data.forEach(p => {
    const tr = document.createElement("tr");
    tr.append(td(dt(p.criado_em)), td(p.cliente), td(p.motoboy || "—"), td(p.retirada + " → " + p.entrega),
      td(Number(p.distancia_km).toLocaleString("pt-BR")), td(money(p.preco)), td(p.status));
    tb.append(tr);
  });
  if (!data.length) tb.innerHTML = '<tr><td colspan="7" class="small">Nenhum pedido.</td></tr>';
}
</script>
</body>
</html>
